name: Refresh KTC value history
on:
  schedule:
    - cron: "41 9 * * 1"   # weekly, Monday ~5 a.m. ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_history.py
      - name: Commit if changed
        run: |
          git config user.name "spdl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ktc_hist.json data/ktc_hist_status.json 2>/dev/null || git add data/ktc_hist_status.json
          git diff --cached --quiet || git commit -m "Weekly KTC history refresh"
          git pull --rebase -q && git push
