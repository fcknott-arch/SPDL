name: Refresh player and KTC data
on:
  schedule:
    - cron: "17 10 * * *"   # daily, ~6 a.m. ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_data.py
      - name: Commit if changed
        run: |
          git config user.name "spdl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json data/ktc.json
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push
