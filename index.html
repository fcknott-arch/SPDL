<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPDL Hub</title>
<meta name="description" content="SPDL dynasty league hub: live standings, playoff odds, trade ledger, history, what-ifs and weekly pick'em.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231D5A3B'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='26' text-anchor='middle' fill='%23F4B329'%3ESP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: scoreboard header over a chalked field; one panel per tab, tables and cards on a turf-tinted ground. */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --sunk:#E5EAE2; --ink:#0F1A14; --muted:#5A675F; --line:#D3DACF;
  --turf:#1D5A3B; --turf-ink:#F3F7F2; --amber:#A86F00; --amber-hi:#F4B329; --amber-bg:#FFF1CC;
  --good:#1E7A47; --bad:#B23F37; --blue:#2C62A8; --blue-bg:#E1EAF6; --good-bg:#E2F3E8; --bad-bg:#F9E3E0; --chip:#E9EEE6;
  --f-display:"Big Shoulders Display","Archivo Narrow","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1510; --surface:#12201A; --sunk:#0E1A14; --ink:#E6EDE8; --muted:#94A49B; --line:#223529;
  --turf:#12402A; --turf-ink:#EAF3EC; --amber:#F2B53A; --amber-hi:#F4B329; --amber-bg:#3A2D0E;
  --good:#5CC48A; --bad:#E58078; --good-bg:#16301F; --bad-bg:#3A1C19; --chip:#1A2B22; --blue:#79A7E8; --blue-bg:#16253A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1510; --surface:#12201A; --sunk:#0E1A14; --ink:#E6EDE8; --muted:#94A49B; --line:#223529;
  --turf:#12402A; --turf-ink:#EAF3EC; --amber:#F2B53A; --amber-hi:#F4B329; --amber-bg:#3A2D0E;
  --good:#5CC48A; --bad:#E58078; --good-bg:#16301F; --bad-bg:#3A1C19; --chip:#1A2B22; --blue:#79A7E8; --blue-bg:#16253A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}

.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--turf)} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--good)}} :root[data-theme="dark"] a{color:var(--good)}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber-hi);outline-offset:2px}

/* header */
.board{background:var(--turf);color:var(--turf-ink);position:relative;overflow:hidden}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:repeating-linear-gradient(90deg,transparent 0 79px,currentColor 79px 81px),
  repeating-linear-gradient(90deg,transparent 0 15px,currentColor 15px 16px);
  background-size:auto,auto;background-position:0 0,0 100%;-webkit-mask:linear-gradient(#000 0 0) top/100% 10px no-repeat,linear-gradient(#000 0 0) bottom/100% 10px no-repeat,linear-gradient(#000 0 0) center/100% 100% no-repeat;mask:none}
.board .wrap{padding-block:18px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-size:clamp(44px,8vw,72px);font-weight:900;letter-spacing:.02em}
.brand .sub{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.scorebug{display:flex;gap:6px;align-items:stretch;font-family:var(--f-mono)}
.scorebug div{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;text-align:center}
.scorebug b{display:block;font-size:20px;color:var(--amber-hi);font-weight:600;line-height:1.1}
.scorebug span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.fresh{font-size:12px;opacity:.85;width:100%}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;padding:12px 12px 10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--amber-hi)}
nav.tabs a .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber-hi);margin-left:5px;vertical-align:2px}
main{padding-block:22px 64px}
section.panel{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.card[style*="display:grid"]{grid-template-columns:minmax(0,1fr)}
.h-row>div{min-width:0}
.lead{max-width:68ch;color:var(--muted);margin:0}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-row h2{font-size:36px;font-weight:800;text-transform:uppercase}
.kicker{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);font-size:14px}
h3{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.note{font-size:13px;color:var(--muted)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:2px solid var(--ink);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,td.num{white-space:nowrap}
th.r,td.r{text-align:right}
tr.cut td{border-bottom:2px dashed var(--amber-hi)}
tr.me td{background:var(--amber-bg)}
.team{display:flex;align-items:center;gap:8px;min-width:0}
td.tc{min-width:180px}
.tshort{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
.team b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team small{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 6px;border-radius:5px;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.03em;background:var(--chip);color:var(--ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
.p-allin{background:var(--turf);color:var(--turf-ink)} .p-contend{background:var(--blue-bg);color:var(--blue)}
.p-retool{background:var(--amber-bg);color:var(--amber)} .p-rebuild{background:var(--bad-bg);color:var(--bad)}
.up{color:var(--good)} .down{color:var(--bad)} .muted{color:var(--muted)}
.pct{position:relative;display:block;min-width:72px;height:22px;background:var(--sunk);border-radius:4px;overflow:hidden}
.pct i{position:absolute;inset:0 auto 0 0;background:var(--turf);opacity:.85}
.pct em{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:600;mix-blend-mode:normal}
.pct.amber i{background:var(--amber-hi)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input[type=text],textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
label{font-size:13px;font-weight:600;display:grid;gap:4px}

/* matchups */
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.mu .side{min-width:0}
.mu .side.r{text-align:right}
.mu .side.r .team{justify-content:flex-end}
.mu .vs{font-family:var(--f-display);font-weight:800;color:var(--muted)}
.wp{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex;margin-top:8px}
.wp i{display:block;height:100%;background:var(--turf)} .wp i+i{background:var(--amber-hi)}
.wp-l{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.score{font-family:var(--f-mono);font-size:22px;font-weight:600}
.win .score{color:var(--ink)} .lose .score{color:var(--muted)}

/* what-if */
.wif{display:grid;gap:10px}
.wif .wk{display:grid;gap:6px}
.wif .wk h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wif .g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wif .g button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 8px;text-align:left;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;min-width:0}
.wif .g button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wif .g button[aria-pressed="true"]{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.wif .g button small{font-family:var(--f-mono);opacity:.75}

/* trades */
.trade{display:grid;gap:10px}
.trade .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.trade .sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.trade .side{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;align-content:start}
.trade .side.won{border-color:var(--good);background:var(--good-bg)}
.trade ul{margin:0;padding-left:18px;font-size:13px}
.trade .val{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.trade .val b{font-family:var(--f-mono)}

/* history */
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.champ{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);display:grid;gap:4px}
.champ .yr{font-family:var(--f-display);font-weight:900;font-size:30px;color:var(--amber)}
.champ .who{font-weight:700}
.h2h td{text-align:center;font-family:var(--f-mono);font-size:12px;padding:6px 4px;min-width:44px}
.h2h th{text-align:center;font-size:10px;letter-spacing:.04em;padding:6px 4px}
.h2h td.self{background:var(--sunk)}

/* boards */
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);text-align:center}
.notice{border-left:4px solid var(--amber-hi);background:var(--amber-bg);border-radius:6px;padding:10px 12px;font-size:14px}
.post{display:grid;gap:6px}
.post h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase}
.post .body{white-space:pre-wrap}
.poll .opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface);text-align:left;width:100%;position:relative;overflow:hidden}
.poll .opt .bar{position:absolute;inset:0 auto 0 0;background:var(--good-bg);z-index:0}
.poll .opt>*{position:relative;z-index:1}
.poll .opt[aria-pressed="true"]{border-color:var(--turf);box-shadow:inset 0 0 0 1px var(--turf)}
.poll .opts{display:grid;gap:6px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;cursor:pointer;text-align:left;display:grid;gap:2px;min-width:0}
.pick button[aria-pressed="true"]{border-color:var(--turf);background:var(--good-bg)}
.pick button.right{border-color:var(--good)} .pick button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.pick button small{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.chip{display:inline-block;font-size:12px;padding:2px 7px;border-radius:5px;background:var(--chip);margin:2px 4px 2px 0;white-space:nowrap}
.chip.from{background:var(--amber-bg);color:var(--amber)}
svg text{font-family:var(--f-body)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
footer{color:var(--muted);font-size:12px;padding-block:24px;border-top:1px solid var(--line)}
@media (max-width:560px){.h-row h2{font-size:30px} .score{font-size:18px} td,th{padding:7px 6px}}
@media (prefers-reduced-motion:no-preference){.pct i,.wp i{transition:width .35s ease}}
</style>
<style>
.auth{display:flex;align-items:center;gap:8px;margin-left:auto}
.auth img{width:28px;height:28px;border-radius:50%}
.auth .btn{background:rgba(0,0,0,.25);color:var(--turf-ink);border-color:rgba(255,255,255,.25)}
.loading{padding:40px 0;color:var(--muted);text-align:center}
.uid{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:4px 8px;border-radius:5px;user-select:all;word-break:break-all}
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="brand"><h1>SPDL</h1><span class="sub">Superflex Dynasty · Est. 2020</span></div>
    <div class="scorebug" id="scorebug"></div>
    <div class="auth" id="auth"></div>
    <div class="fresh" id="fresh">Loading the latest from Sleeper…</div>
  </div>
</header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main class="wrap" id="main"><div class="loading">Loading league data…</div></main>
<footer class="wrap" id="foot"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
